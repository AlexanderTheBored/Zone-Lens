<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayuyeng Beach Resort — Receipt Generator</title>
  <style>
    /* ── Base ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      color: #222;
    }

    /* ── App shell ── */
    #app {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 340px;
      min-width: 260px;
      background: #1a3a5c;
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 20px 16px 12px;
      background: #122a43;
    }

    #sidebar-header h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: #7ecfff;
    }

    #sidebar-header p {
      font-size: 11px;
      color: #aac8e0;
      margin-top: 4px;
    }

    #search-bar {
      padding: 10px 12px;
      background: #162f4a;
      border-bottom: 1px solid #234;
    }

    #search-bar input {
      width: 100%;
      padding: 6px 10px;
      border-radius: 4px;
      border: none;
      background: #1e3d59;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    #search-bar input::placeholder { color: #5a8aac; }

    #entry-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    #entry-list::-webkit-scrollbar { width: 5px; }
    #entry-list::-webkit-scrollbar-thumb { background: #2d5478; border-radius: 3px; }

    .entry-item {
      padding: 10px 14px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .15s, border-color .15s;
    }

    .entry-item:hover { background: #1e3d59; }
    .entry-item.active { background: #1e4d70; border-left-color: #7ecfff; }

    .entry-item .e-date { font-size: 10px; color: #7ecfff; font-weight: 600; margin-bottom: 2px; }
    .entry-item .e-desc { font-size: 12px; color: #d0e8f5; line-height: 1.3; }
    .entry-item .e-badge { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px; margin-top: 3px; font-weight: 700; letter-spacing: .4px; }

    .badge-purchase { background: #1a6b3a; color: #a8f0c0; }
    .badge-salary   { background: #6b4a1a; color: #f0cfa8; }
    .badge-bill     { background: #6b1a1a; color: #f0a8a8; }
    .badge-misc     { background: #3a1a6b; color: #c8a8f0; }

    .e-amount { float: right; font-size: 11px; color: #aaa; }
    .e-amount.debit  { color: #ff9999; }
    .e-amount.credit { color: #99ffbb; }

    /* ── Main panel ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #e8eef4;
      overflow: hidden;
    }

    #toolbar {
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #d0dce8;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #toolbar h2 { font-size: 15px; color: #1a3a5c; flex: 1; }

    .btn {
      padding: 7px 16px;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #1a3a5c; color: #fff; }
    .btn-success { background: #1a6b3a; color: #fff; }
    .btn-outline { background: transparent; border: 1.5px solid #1a3a5c; color: #1a3a5c; }

    #preview-area {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #no-selection {
      margin: auto;
      text-align: center;
      color: #7a9ab5;
    }
    #no-selection svg { opacity: .3; margin-bottom: 12px; }
    #no-selection p { font-size: 14px; }

    /* ── Receipt styles ── */
    .receipt {
      background: #fff;
      width: 520px;
      padding: 0;
      box-shadow: 0 4px 24px rgba(0,0,0,.15);
      border-radius: 4px;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .receipt-header {
      padding: 18px 24px 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: #fff;
    }

    .receipt-header .r-type {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .receipt-header .r-company {
      font-size: 11px;
      opacity: .85;
      margin-top: 3px;
    }

    .receipt-header .r-meta {
      text-align: right;
      font-size: 11px;
      line-height: 1.7;
    }

    .receipt-header .r-meta strong { font-size: 13px; }

    /* colour themes */
    .theme-purchase .receipt-header { background: #1a3a5c; }
    .theme-salary   .receipt-header { background: #3a5c1a; }
    .theme-bill     .receipt-header { background: #5c1a1a; }
    .theme-misc     .receipt-header { background: #3a1a5c; }

    .receipt-body { padding: 18px 24px; }

    .receipt-info-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 3px 8px;
      font-size: 11.5px;
      margin-bottom: 18px;
      border-bottom: 1px solid #e0e8f0;
      padding-bottom: 14px;
    }

    .receipt-info-grid .label { color: #888; font-weight: 600; }
    .receipt-info-grid .value { color: #222; }

    .receipt-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .receipt-table thead tr {
      border-bottom: 2px solid #1a3a5c;
    }

    .receipt-table thead th {
      padding: 6px 8px;
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #1a3a5c;
    }

    .receipt-table thead th:last-child { text-align: right; }

    .receipt-table tbody td {
      padding: 8px 8px;
      border-bottom: 1px solid #f0f4f8;
      vertical-align: top;
    }

    .receipt-table tbody td:last-child { text-align: right; white-space: nowrap; }

    .receipt-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 8px;
      border-top: 2px solid #1a3a5c;
      margin-top: 4px;
    }

    .receipt-total-row .total-label {
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #1a3a5c;
    }

    .receipt-total-row .total-amount {
      font-weight: 700;
      font-size: 15px;
      color: #1a3a5c;
    }

    .receipt-footer {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #e8eef4;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .receipt-footer .thank-you {
      font-size: 10px;
      color: #888;
      max-width: 220px;
      line-height: 1.5;
    }

    .receipt-footer .sig-block {
      text-align: center;
      min-width: 140px;
    }

    .receipt-footer .sig-line {
      border-bottom: 1px solid #555;
      margin-bottom: 4px;
      height: 36px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-family: 'Brush Script MT', cursive;
      font-size: 20px;
      color: #333;
      padding-bottom: 2px;
    }

    .receipt-footer .sig-label {
      font-size: 9.5px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* Print styles */
    @media print {
      body { background: #fff; }
      #app { display: block; height: auto; }
      #sidebar, #toolbar { display: none !important; }
      #preview-area { padding: 0; display: block; overflow: visible; }
      .receipt { box-shadow: none; width: 100%; max-width: 600px; margin: 0 auto; }
      #no-selection { display: none; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Sidebar ── -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Ayuyeng Beach Resort</h1>
      <p>General Journal — April 2026</p>
    </div>
    <div id="search-bar">
      <input type="text" id="search" placeholder="Search entries…" oninput="renderList()" />
    </div>
    <div id="entry-list"></div>
  </div>

  <!-- ── Main panel ── -->
  <div id="main">
    <div id="toolbar">
      <h2 id="toolbar-title">Select an entry to preview its receipt</h2>
      <button class="btn btn-outline" onclick="printAll()">Print All</button>
      <button class="btn btn-primary" onclick="printCurrent()" id="btn-print" style="display:none">Print This</button>
    </div>
    <div id="preview-area">
      <div id="no-selection">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#7a9ab5" stroke-width="1.5">
          <rect x="4" y="2" width="16" height="20" rx="2"/>
          <line x1="8" y1="7" x2="16" y2="7"/>
          <line x1="8" y1="11" x2="16" y2="11"/>
          <line x1="8" y1="15" x2="12" y2="15"/>
        </svg>
        <p>Select a journal entry from the left<br>to preview its receipt.</p>
      </div>
      <div id="receipt-mount" style="display:none"></div>
    </div>
  </div>

</div>

<script>
// ── Journal data ────────────────────────────────────────────────────────────
const ENTRIES = [
  // Apr 20
  { date: 'Apr 20, 2026', desc: '1st Salary – Jennifer (Resort Housekeeper)',         type: 'salary',   amount: 1750.00,  side: 'credit', paidTo: 'Jennifer', method: 'Cash', category: 'Payroll – Resort Housekeeper' },
  { date: 'Apr 20, 2026', desc: '1st Salary – Dolyo (Resort Staff)',                   type: 'salary',   amount: 1250.00,  side: 'credit', paidTo: 'Dolyo',    method: 'Cash', category: 'Payroll – Resort Staff' },
  { date: 'Apr 20, 2026', desc: '2nd Salary Tranche – Jennifer (Allowance)',            type: 'salary',   amount: 4950.00,  side: 'credit', paidTo: 'Jennifer', method: 'Cash', category: 'Payroll – Allowance' },
  { date: 'Apr 20, 2026', desc: 'Purchase – Plastic Chair, Bantaki Style (Lobby Use)', type: 'purchase', amount: 48.50,    side: 'debit',  paidTo: 'Supplier', method: 'Cash', category: 'Lobby Supplies' },
  { date: 'Apr 20, 2026', desc: 'Purchase – Tide Bar Soap, 1 Baston (Laundry Supplies)', type: 'purchase', amount: 121.50, side: 'debit',  paidTo: 'Supplier', method: 'Cash', category: 'Laundry Supplies' },
  { date: 'Apr 20, 2026', desc: 'Purchase – Downy Fabric Conditioner, 15 pcs @ ₱6.75',  type: 'purchase', amount: 163.00, side: 'debit',  paidTo: 'Supplier', method: 'Cash', category: 'Laundry Supplies' },
  // Apr 21
  { date: 'Apr 21, 2026', desc: 'Purchase – Trash Bags XXXL, 2 pcs (Room Maintenance)',  type: 'purchase', amount: 130.00, side: 'debit',  paidTo: 'Supplier', method: 'Cash', category: 'Room Maintenance' },
  { date: 'Apr 21, 2026', desc: 'Purchase – Tisyu / Tissue Paper, 6 pcs (Guest Amenities)', type: 'purchase', amount: 55.00, side: 'debit', paidTo: 'Supplier', method: 'Cash', category: 'Guest Amenities' },
  { date: 'Apr 21, 2026', desc: 'Purchase – Bath Towels, 5 pcs (Guest Room Supply)',    type: 'purchase', amount: 150.00,  side: 'debit',  paidTo: 'Supplier', method: 'Cash', category: 'Guest Room Supply' },
  { date: 'Apr 21, 2026', desc: 'Purchase – Pot-Pot Packaging & Craft Materials (Resort)', type: 'purchase', amount: 779.00, side: 'debit', paidTo: 'Supplier', method: 'Cash', category: 'Resort Materials' },
  // Apr 22
  { date: 'Apr 22, 2026', desc: 'Purchase – Microfiber Blanket, 5 pcs (Guest Rooms)',  type: 'purchase', amount: 1250.00, side: 'debit',  paidTo: 'Supplier', method: 'Cash', category: 'Guest Room Supply' },
  { date: 'Apr 22, 2026', desc: '2nd Salary Tranche – Dolyo (Additional)',              type: 'salary',   amount: 1250.00, side: 'credit', paidTo: 'Dolyo',    method: 'Cash', category: 'Payroll – Additional Tranche' },
  { date: 'Apr 22, 2026', desc: '2nd Salary Tranche – Jennifer (Additional)',           type: 'salary',   amount: 1750.00, side: 'credit', paidTo: 'Jennifer', method: 'Cash', category: 'Payroll – Additional Tranche' },
  // Apr 23
  { date: 'Apr 23, 2026', desc: 'Miscellaneous Cash Disbursement',                      type: 'misc',     amount: 150.00,  side: 'debit',  paidTo: 'Various',  method: 'Cash', category: 'Miscellaneous' },
  { date: 'Apr 23, 2026', desc: 'Purchase – Gasket, 2 pcs @ ₱75 (Maintenance Parts)',   type: 'purchase', amount: 150.00,  side: 'debit',  paidTo: 'Supplier', method: 'Cash', category: 'Maintenance Parts' },
  { date: 'Apr 23, 2026', desc: 'Purchase – Pail with Cover (Housekeeping Supply)',      type: 'purchase', amount: 252.00,  side: 'debit',  paidTo: 'Supplier', method: 'Cash', category: 'Housekeeping Supply' },
  { date: 'Apr 23, 2026', desc: 'Purchase – Surf Powder Detergent, 36 pcs (Laundry)',   type: 'purchase', amount: 243.00,  side: 'debit',  paidTo: 'Supplier', method: 'Cash', category: 'Laundry Supplies' },
  // Apr 24
  { date: 'Apr 24, 2026', desc: 'Purchase – Downy Fabric Conditioner, 36 pcs (Laundry)', type: 'purchase', amount: 48.50, side: 'debit',  paidTo: 'Supplier', method: 'Cash', category: 'Laundry Supplies' },
  { date: 'Apr 24, 2026', desc: 'Purchase – Tide Bar Soap, 1 Baston (Laundry Supplies)', type: 'purchase', amount: 1298.00, side: 'debit', paidTo: 'Supplier', method: 'Cash', category: 'Laundry Supplies' },
  { date: 'Apr 24, 2026', desc: 'Bill Payment – BIR Tax Remittance',                    type: 'bill',     amount: 700.00,  side: 'debit',  paidTo: 'Bureau of Internal Revenue', method: 'GCash', category: 'Tax Compliance' },
  // Apr 25
  { date: 'Apr 25, 2026', desc: 'Purchase – Pala / Shovel, 2 pcs @ ₱350 (Grounds Maint.)', type: 'purchase', amount: 700.00, side: 'debit', paidTo: 'Supplier', method: 'Cash', category: 'Grounds Maintenance' },
  { date: 'Apr 25, 2026', desc: '3rd Salary Tranche – Jennifer',                        type: 'salary',   amount: 1758.00, side: 'credit', paidTo: 'Jennifer', method: 'Cash', category: 'Payroll – 3rd Tranche' },
  { date: 'Apr 25, 2026', desc: '3rd Salary Tranche – Dolyo',                           type: 'salary',   amount: 1250.00, side: 'credit', paidTo: 'Dolyo',    method: 'Cash', category: 'Payroll – 3rd Tranche' },
  // Apr 26
  { date: 'Apr 26, 2026', desc: '4th Salary Tranche – Jennifer',                        type: 'salary',   amount: 1750.00, side: 'credit', paidTo: 'Jennifer', method: 'Cash', category: 'Payroll – 4th Tranche' },
  { date: 'Apr 26, 2026', desc: '4th Salary Tranche – Dolyo',                           type: 'salary',   amount: 1350.00, side: 'credit', paidTo: 'Dolyo',    method: 'Cash', category: 'Payroll – 4th Tranche' },
  // Apr 29
  { date: 'Apr 29, 2026', desc: 'Purchase – Floor Mat, 5 yards @ ₱99/yard (Lobby/Rooms)', type: 'purchase', amount: 495.00, side: 'debit', paidTo: 'Supplier', method: 'Cash', category: 'Lobby/Room Supplies' },
];

// Auto-number receipts per type
const counters = { purchase: 0, salary: 0, bill: 0, misc: 0 };
ENTRIES.forEach(e => {
  counters[e.type]++;
  const prefix = { purchase: 'PR', salary: 'PV', bill: 'OR', misc: 'CV' }[e.type];
  e.receiptNo = `${prefix}-${String(counters[e.type]).padStart(3, '0')}`;
});

// ── Receipt type metadata ──────────────────────────────────────────────────
const TYPE_META = {
  purchase: { label: 'Purchase Receipt', theme: 'theme-purchase', sigName: 'Supplier Agent' },
  salary:   { label: 'Payment Voucher',  theme: 'theme-salary',   sigName: 'Resort Manager' },
  bill:     { label: 'Official Receipt', theme: 'theme-bill',     sigName: 'Authorized Agent' },
  misc:     { label: 'Cash Voucher',     theme: 'theme-misc',     sigName: 'Cashier' },
};

const BADGE_CLASS = { purchase: 'badge-purchase', salary: 'badge-salary', bill: 'badge-bill', misc: 'badge-misc' };

function fmt(n) {
  return '₱' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ── Render sidebar list ────────────────────────────────────────────────────
let activeIdx = null;

function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('entry-list');
  list.innerHTML = '';

  ENTRIES.forEach((e, i) => {
    if (q && !e.desc.toLowerCase().includes(q) && !e.date.toLowerCase().includes(q)) return;

    const div = document.createElement('div');
    div.className = 'entry-item' + (i === activeIdx ? ' active' : '');
    div.onclick = () => selectEntry(i);

    const meta = TYPE_META[e.type];
    div.innerHTML = `
      <div class="e-date">${e.date}
        <span class="e-amount ${e.side}">${fmt(e.amount)}</span>
      </div>
      <div class="e-desc">${e.desc}</div>
      <span class="e-badge ${BADGE_CLASS[e.type]}">${meta.label}</span>
      <span style="font-size:9px;color:#5a8aac;margin-left:6px;">${e.receiptNo}</span>
    `;
    list.appendChild(div);
  });
}

// ── Build receipt HTML ─────────────────────────────────────────────────────
function buildReceipt(e) {
  const meta = TYPE_META[e.type];

  const receivedFrom = e.type === 'salary'
    ? 'Ayuyeng Beach Resort'
    : e.type === 'bill'
    ? 'Ayuyeng Beach Resort'
    : 'Ayuyeng Beach Resort';

  const billedTo = e.type === 'salary'
    ? e.paidTo
    : e.type === 'bill'
    ? e.paidTo
    : e.paidTo;

  const address = e.type === 'salary'
    ? 'Ayuyeng Beach Resort, Cebu'
    : e.type === 'bill'
    ? 'BIR Regional Office, Cebu City'
    : 'Local Supplier / Market';

  return `
  <div class="receipt ${meta.theme}">
    <div class="receipt-header">
      <div>
        <div class="r-type">${meta.label}</div>
        <div class="r-company">Ayuyeng Beach Resort</div>
      </div>
      <div class="r-meta">
        <div><strong>No: ${e.receiptNo}</strong></div>
        <div>Date: ${e.date}</div>
      </div>
    </div>

    <div class="receipt-body">
      <div class="receipt-info-grid">
        <span class="label">Received From /</span> <span class="value">${receivedFrom}</span>
        <span class="label">Billed To:</span>       <span class="value">${billedTo}</span>
        <span class="label">Address:</span>          <span class="value">${address}</span>
        <span class="label">Payment</span>           <span class="value"></span>
        <span class="label">Method:</span>           <span class="value">${e.method}</span>
      </div>

      <table class="receipt-table">
        <thead>
          <tr>
            <th>Description</th>
            <th style="text-align:right">Amount (P)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>${e.desc.replace(/^(Purchase – |Bill Payment – )/, '')}<br>
              <span style="font-size:10px;color:#888">${e.category}</span>
            </td>
            <td>${e.amount.toLocaleString('en-PH', { minimumFractionDigits: 2 })}</td>
          </tr>
        </tbody>
      </table>

      <div class="receipt-total-row">
        <span class="total-label">TOTAL</span>
        <span class="total-amount">${fmt(e.amount)}</span>
      </div>

      <div class="receipt-footer">
        <div class="thank-you">
          Thank you for your transaction. Please keep this receipt for your records.
        </div>
        <div class="sig-block">
          <div class="sig-line">${meta.sigName.split(' ')[0]}</div>
          <div class="sig-label">Authorized Signature</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ── Select an entry ────────────────────────────────────────────────────────
function selectEntry(i) {
  activeIdx = i;
  renderList();

  const e = ENTRIES[i];
  const mount = document.getElementById('receipt-mount');
  const noSel = document.getElementById('no-selection');
  const btnPrint = document.getElementById('btn-print');
  const title = document.getElementById('toolbar-title');

  mount.innerHTML = buildReceipt(e);
  mount.style.display = 'block';
  noSel.style.display = 'none';
  btnPrint.style.display = 'inline-block';
  title.textContent = `${e.receiptNo} — ${e.date}`;
}

// ── Print helpers ──────────────────────────────────────────────────────────
function printCurrent() {
  window.print();
}

function printAll() {
  const win = window.open('', '_blank');
  const styles = document.querySelector('style').outerHTML;
  const receipts = ENTRIES.map(buildReceipt).join(
    '<div style="page-break-after:always;margin-bottom:40px"></div>'
  );
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">${styles}
    <style>body{background:#fff;padding:20px}.receipt{margin:0 auto 40px;max-width:560px}</style>
    </head><body>${receipts}</body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => { win.print(); }, 400);
}

// ── Init ───────────────────────────────────────────────────────────────────
renderList();
</script>
</body>
</html>
